name: op6-mesa

# Build Mesa 25.0.7 (libOSMesa.8.dylib: OpenGL ES 2/3, freedreno on Adreno 630 via
# SweetGPUUserClient, softpipe fallback) and sweet-gl-test for OnePlus 6 (Milestone G3).
# Runs on macos-26 (macos-14/15 are not acquired for this account) with Xcode's iPhoneOS SDK.
# Also builds the G4 CoreAnimation bridge (op6/ca-bridge: libsweet-gl.dylib, libsweet-ca.dylib).
# Artifact: lib/ (what goes to /usr/local/lib on the phone), unstripped/libOSMesa.8.dylib and
# dSYM/libOSMesa.8.dylib.dSYM (Mesa's DWARF, -O2 -g, for symbolizing crash reports), meta/, the tests.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build Mesa 25.0.7 (libOSMesa.8.dylib, freedreno + softpipe)
        run: |
          set -eux
          brew install bison || true
          op6/mesa/build.sh out
      - name: Build sweet-gl-test and sweetgpu-test
        run: |
          set -eux
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -isysroot "$SDK" \
            -O2 -Wall -Wextra -Werror -framework IOKit -framework CoreFoundation \
            -o out/sweet-gl-test s9/ios-tools/sweet-gl-test.c out/lib/libOSMesa.8.dylib
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -isysroot "$SDK" \
            -O2 -Wall -Werror -framework IOKit -framework CoreFoundation \
            -o out/sweetgpu-test s9/ios-tools/sweetgpu-test.c
          codesign -s - -f out/sweet-gl-test out/sweetgpu-test
          file out/sweet-gl-test out/lib/libOSMesa.8.dylib
          otool -L out/sweet-gl-test out/lib/libOSMesa.8.dylib
          # G4 bridge: EAGLContext -> Mesa (libsweet-gl) and the backboardd hook (libsweet-ca)
          mkdir -p obj
          python3 op6/ca-bridge/mkeagl.py op6/ca-bridge/eagl_slots.txt mesa-work/meta/gl.xml \
            mesa-work/meta/exported-gl.txt op6/ca-bridge/eagl.c > obj/eagl_gen.h
          CC="xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -isysroot $SDK -O2 -Wall"
          $CC -dynamiclib -Iobj -Iop6/ca-bridge -install_name /usr/local/lib/libsweet-gl.dylib \
            -framework CoreFoundation -framework IOSurface -framework IOKit -lobjc \
            -o out/lib/libsweet-gl.dylib op6/ca-bridge/eagl.c op6/ca-bridge/sweet_gl_osmesa.c op6/ca-bridge/sweet_klog.c \
            out/lib/libOSMesa.8.dylib
          $CC -dynamiclib -install_name /usr/local/lib/libsweet-ca.dylib -framework CoreFoundation -framework IOKit \
            -Iop6/ca-bridge -o out/lib/libsweet-ca.dylib op6/ca-bridge/sweet_ca.c op6/ca-bridge/sweet_klog.c
          codesign -s - -f out/lib/libsweet-gl.dylib out/lib/libsweet-ca.dylib
          otool -L out/lib/libsweet-gl.dylib out/lib/libsweet-ca.dylib
          # both dylibs carry sweet_klog (selector 0x7f), kept private to each
          nm -m out/lib/libsweet-gl.dylib out/lib/libsweet-ca.dylib | grep '_sweet_klog'
          if nm -gU out/lib/libsweet-gl.dylib out/lib/libsweet-ca.dylib | grep -q '_sweet_klog'; then exit 1; fi
          # G6a Metal runtime (libbgmtl) + op6-mtl-probe + op6_probe.metallib
          mkdir -p out/bin
          MTL_CC="xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -isysroot $SDK -O1 -g -fno-objc-arc -Wall -Wno-deprecated-declarations"
          $MTL_CC -dynamiclib -Iop6/mesa/air -install_name /usr/local/lib/libbgmtl.dylib \
            -framework Foundation -framework Metal -framework IOSurface -lobjc \
            -o out/lib/libbgmtl.dylib op6/metal/src/bgmtl.m out/lib/libbgair.dylib
          $MTL_CC -o out/bin/op6-mtl-probe op6/metal/test/op6-mtl-probe.m \
            -framework Foundation -framework Metal -lobjc \
            -Wl,-rpath,@executable_path/../lib -Wl,-rpath,/usr/local/lib
          if ! xcrun --sdk iphoneos -f metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain || true
          fi
          xcrun --sdk iphoneos metal -mios-version-min=16.0 -c op6/metal/test/op6_probe.metal -o obj/op6_probe.air
          xcrun --sdk iphoneos metallib obj/op6_probe.air -o out/bin/op6_probe.metallib
          codesign -s - -f out/lib/libbgmtl.dylib out/bin/op6-mtl-probe
          # G6b Metal system-wide plugin bundle -> out/bundle/Chlorophyll.bundle + default op6-mtl-clients
          mkdir -p out/bundle
          bash op6/metal/plugin/build.sh out/lib/libbgair.dylib out/bundle
          file out/lib/libbgair.dylib out/lib/libbgmtl.dylib out/bin/op6-mtl-probe out/bin/op6_probe.metallib out/bundle/Chlorophyll.bundle/Chlorophyll
          otool -L out/lib/libbgair.dylib out/lib/libbgmtl.dylib out/bin/op6-mtl-probe out/bundle/Chlorophyll.bundle/Chlorophyll
          codesign -dvvv out/bundle/Chlorophyll.bundle/Chlorophyll 2>&1 | head -n 10
          nm -gU out/lib/libbgair.dylib | grep '_sweet_drm_'
          nm -gU out/lib/libbgmtl.dylib | grep '_bgmtl_'
          # Mesa symbols: lib/ keeps every function name, unstripped/ + dSYM/ are for llvm-symbolizer / atos
          ls -l out/lib/libOSMesa.8.dylib out/unstripped/libOSMesa.8.dylib out/lib/libbgair.dylib out/unstripped/libbgair.dylib
          xcrun dwarfdump --uuid out/lib/libOSMesa.8.dylib out/dSYM/libOSMesa.8.dylib.dSYM out/lib/libbgair.dylib out/dSYM/libbgair.dylib.dSYM
          du -sh out/dSYM/libOSMesa.8.dylib.dSYM out/dSYM/libbgair.dylib.dSYM
          mkdir -p out/meta
          cp mesa-work/meta/gl.xml mesa-work/meta/exported-gl.txt out/meta/
      - name: Build phone-tools (lsreg, oslog, exq)
        run: |
          set -eux
          bash op6/phone-tools/build.sh out/bin
          file out/bin/lsreg out/bin/oslog out/bin/exq
          otool -L out/bin/lsreg out/bin/oslog out/bin/exq
      - name: Checksum artifact
        run: |
          set -eux
          cd out && find . -type f ! -name SHA256SUMS | sort | xargs shasum -a 256 > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: op6-mesa
          path: out/
